<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Padel</title>
<meta name="description" content="Programme physique padel de 12 semaines : séances, exercices, mobilité, minuteurs et suivi.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Padel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF2F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D151D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#E3E9E8; --ink:#13202C; --ink-2:#4A5A66; --line:#CBD5D4;
  --court:#1D5AA6; --court-soft:#DCE7F5; --ball:#C6D62B; --ball-ink:#3E4508;
  --b1:#1D5AA6; --b2:#0E8577; --b3:#C2571B;
  --ok:#1F8A4C; --ok-soft:#DCF1E4; --warn:#B7791F; --bad:#B83A3A;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D151D; --surface:#15212C; --surface-2:#1C2A37; --ink:#E6EDF2; --ink-2:#9AAAB6; --line:#2A3B4A;
    --court:#6FA3E8; --court-soft:#1B3350; --ball:#D3E24A; --ball-ink:#1A1D02;
    --b1:#6FA3E8; --b2:#3FC2B0; --b3:#F0925A;
    --ok:#4CC27E; --ok-soft:#173A28; --warn:#E3B04F; --bad:#EE7A7A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D151D; --surface:#15212C; --surface-2:#1C2A37; --ink:#E6EDF2; --ink-2:#9AAAB6; --line:#2A3B4A;
  --court:#6FA3E8; --court-soft:#1B3350; --ball:#D3E24A; --ball-ink:#1A1D02;
  --b1:#6FA3E8; --b2:#3FC2B0; --b3:#F0925A;
  --ok:#4CC27E; --ok-soft:#173A28; --warn:#E3B04F; --bad:#EE7A7A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding:0 16px;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img{max-width:100%}[hidden]{display:none!important}
button,input,select,textarea{touch-action:manipulation}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,6vw,52px);text-transform:uppercase}
h2{font-size:26px;text-transform:uppercase}
h3{font-size:20px}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;flex-direction:column;gap:10px}
.hero-row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.stat-row{display:flex;gap:22px;flex-wrap:wrap}
.stat .v{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.stat .k{font-size:12px;color:var(--ink-2)}
/* week strip = court */
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.wk{appearance:none;border:0;border-radius:6px;padding:8px 0 6px;background:var(--surface-2);color:var(--ink);cursor:pointer;font-family:var(--display);font-size:17px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.wk .bar{width:70%;height:4px;border-radius:2px}
.wk .dl{font-family:var(--mono);font-size:9px;color:var(--ink-2);letter-spacing:.05em}
.wk.sel{outline:2px solid var(--ink);outline-offset:-2px}
.wk.now::after{content:"";position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--ball);box-shadow:0 0 0 1.5px var(--ball-ink)}
.wk:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--court);outline-offset:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;position:sticky;top:0;z-index:20;background:var(--bg);margin-inline:-16px;padding-inline:16px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-family:var(--display);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--court)}
.panel{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
/* week days */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 9px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:104px;font:inherit}
.day .d{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);display:flex;justify-content:space-between}
.day .t{font-family:var(--display);font-size:16px;font-weight:600;line-height:1.1}
.day .chip{margin-top:auto;align-self:flex-start;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.day.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day.today .d span:first-child{color:var(--court);font-weight:600}
.day.done{background:var(--ok-soft);border-color:var(--ok)}
.day.done .chip{background:var(--ok);color:var(--surface)}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
@media (max-width:720px){
  .days{grid-template-columns:repeat(4,minmax(0,1fr))}
  .strip{grid-template-columns:repeat(6,1fr)}
}
@media (max-width:420px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* session */
.sess-head{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:flex-start}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.cue{background:var(--court-soft);border-radius:8px;padding:10px 12px;font-size:14px}
ol.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ol.ex li{display:grid;grid-template-columns:28px 1fr minmax(150px,210px);gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
ol.ex li:first-child{border-top:0}
.ex .n{font-family:var(--display);font-size:20px;font-weight:700;color:var(--ink-2);line-height:1.2}
.ex .nm{font-weight:600}
.ex .rx{font-family:var(--mono);font-size:13px;color:var(--court);font-weight:500}
.tm-slot{grid-column:1/-1}
.tm{margin-top:8px;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border:1px solid var(--line)}
.tm-work{background:var(--tm-work);border-color:var(--arrow)}
.tm-rest{background:var(--court-soft);border-color:var(--court)}
.tm-done{background:var(--ok-soft);border-color:var(--ok)}
.tm-top{display:flex;justify-content:space-between;gap:10px}
.tm-step{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.tm-main{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
.tm-phase{font-family:var(--display);font-size:26px;font-weight:700;text-transform:uppercase;line-height:1.05}
.tm-time{font-family:var(--display);font-size:clamp(52px,12vw,76px);font-weight:700;line-height:.95}
.tm-sub{font-size:14px}
.tm-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.tm-bar span{display:block;height:100%;background:var(--arrow);transition:width .1s linear}
.tm-rest .tm-bar span{background:var(--court)}
.tm-ctl{display:flex;gap:8px;flex-wrap:wrap}
.howto+.howto{margin-left:6px}

.ex .nt{font-size:13px;color:var(--ink-2)}
@media (max-width:600px){ol.ex li{grid-template-columns:24px 1fr}.ex .inp{grid-column:2}}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:60px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.btn{appearance:none;border:0;border-radius:8px;padding:10px 16px;font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;background:var(--court);color:#fff}
:root[data-theme="dark"] .btn{color:#0D151D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0D151D}}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.small{font-size:14px;padding:6px 10px}
.check{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.check input{width:18px;height:18px}
.toast{font-size:13px;color:var(--ok);min-height:1.2em}
/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.del{appearance:none;background:none;border:0;color:var(--ink-2);cursor:pointer;font-size:13px;text-decoration:underline}
/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart .axis{fill:var(--ink-2);font-family:var(--mono);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.empty{padding:28px 10px;text-align:center;color:var(--ink-2);font-size:14px;border:1px dashed var(--line);border-radius:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--surface-2);border-radius:10px;padding:12px}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1}
.kpi .k{font-size:12px;color:var(--ink-2);margin-top:4px}
.delta-good{color:var(--ok)} .delta-bad{color:var(--bad)}
/* blocks */
.block{border-top:5px solid var(--bc);display:flex;flex-direction:column;gap:10px}
.block .wks{font-family:var(--mono);font-size:12px;color:var(--bc)}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.guide h3{margin-bottom:8px}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:8px}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:700;font-size:18px;color:var(--court)}
.sync{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.tmpl td:first-child{font-family:var(--mono);text-transform:uppercase;font-size:12px;color:var(--ink-2)}
@media (max-width:600px){
  .wrap{padding-block:10px 40px;gap:14px}
  header.top{gap:8px}
  header.top>.eyebrow{display:none}
  h1{font-size:30px}
  .stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
  .stat .v{font-size:22px}.stat .v .muted{font-size:13px!important}.stat .k{font-size:11px;line-height:1.25}
  .legend>span:not(.sync){display:none}
  .strip{padding:6px;gap:3px}.wk{font-size:15px;padding:6px 0 4px}
  nav.tabs button{font-size:16px;padding:10px 10px}
  .card{padding:14px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

:root{--tm-work:#FBE6D8;--fig:#1B2733;--fig-2:#A7B3BC;--equip:#1D5AA6;--equip-soft:#DCE7F5;--band:#0E8577;--arrow:#D2601F;--ground:#AEB9B8;--court-floor:#DCE8F4;--court-line:#FFFFFF;--glass:#86AACB;--rest:#CBD5D4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tm-work:#3A2618;--fig:#E6EDF2;--fig-2:#5B6D7E;--equip:#6FA3E8;--equip-soft:#1B3350;--band:#3FC2B0;--arrow:#F0925A;--ground:#3A4C5C;--court-floor:#16304B;--court-line:#6E8FB3;--glass:#6FA3E8;--rest:#2A3B4A}}
:root[data-theme="dark"]{--tm-work:#3A2618;--fig:#E6EDF2;--fig-2:#5B6D7E;--equip:#6FA3E8;--equip-soft:#1B3350;--band:#3FC2B0;--arrow:#F0925A;--ground:#3A4C5C;--court-floor:#16304B;--court-line:#6E8FB3;--glass:#6FA3E8;--rest:#2A3B4A}
.figs{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;max-width:calc(var(--n) * 240px)}
.figs.wide{max-width:440px}
.figs figure{margin:0;background:var(--surface-2);border-radius:10px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:4px}
.figs svg{width:100%;height:auto;display:block}
.figs figcaption{font-size:12.5px;color:var(--ink-2);text-align:center;line-height:1.3}
.ftxt{font-family:var(--mono);font-size:9.5px;fill:var(--ink-2);letter-spacing:.04em}
.fnum{font-family:var(--mono);font-size:9px;font-weight:600;fill:var(--arrow)}
.exd{display:flex;flex-direction:column;gap:14px;padding-block:12px 4px}
.exd h4{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px;font-weight:500}
.exd-cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
@media (max-width:640px){.exd-cols{grid-template-columns:1fr}}
.exd-side{display:flex;flex-direction:column;gap:12px}
.exd .steps{font-size:14.5px}
ul.ok-list,ul.no-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.ok-list li::before{content:"✓ ";color:var(--ok);font-weight:700}
.no-list li::before{content:"✗ ";color:var(--bad);font-weight:700}
.vars{display:flex;flex-direction:column;gap:6px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{font-size:12px;background:var(--surface-2);padding:2px 9px;border-radius:99px;color:var(--ink-2)}
.why{font-size:14.5px;max-width:70ch}
.howto{appearance:none;background:none;border:1px solid var(--line);border-radius:99px;padding:3px 11px;margin-top:6px;font:inherit;font-size:12.5px;color:var(--court);cursor:pointer}
.howto[aria-expanded="true"]{background:var(--court-soft)}
.exd-wrap{grid-column:1/-1}
.tsel{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.mob-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
.mob-days{display:flex;gap:6px;flex-wrap:wrap}
.mob-day{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:99px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.mob-day.today{border-color:var(--ink);color:var(--ink)}
.mob-day.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.lib .card{display:flex;flex-direction:column;gap:12px}
details summary{cursor:pointer;color:var(--court);font-size:14px;font-weight:500}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.move{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px}
.move-n{font-family:var(--display);font-size:34px;font-weight:700;color:var(--b2);line-height:1}
.rx{font-family:var(--mono);font-size:13px;color:var(--court);font-weight:500}

</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">Joueur de gauche · P250 / P500 · 12 semaines</div>
    <div class="hero-row">
      <h1>Programme Padel</h1>
      <div class="stat-row" id="heroStats"></div>
    </div>
    <div class="strip" id="strip" role="group" aria-label="Choisir la semaine"></div>
    <div class="legend">
      <span><i style="background:var(--b1)"></i>Bloc 1 · Fondations</span>
      <span><i style="background:var(--b2)"></i>Bloc 2 · Force &amp; puissance</span>
      <span><i style="background:var(--b3)"></i>Bloc 3 · Vitesse spécifique</span>
      <span><i style="background:var(--ball);box-shadow:0 0 0 1.5px var(--ball-ink);border-radius:50%"></i>Semaine en cours</span>
      <span class="sync" id="sync"></span>
    </div>
  </header>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="semaine" aria-selected="true">Semaine</button>
    <button role="tab" data-tab="mobilite" aria-selected="false">Mobilité</button>
    <button role="tab" data-tab="exercices" aria-selected="false">Exercices</button>
    <button role="tab" data-tab="suivi" aria-selected="false">Suivi</button>
    <button role="tab" data-tab="tests" aria-selected="false">Tests</button>
    <button role="tab" data-tab="tournois" aria-selected="false">Tournois</button>
    <button role="tab" data-tab="programme" aria-selected="false">Programme</button>
    <button role="tab" data-tab="guide" aria-selected="false">Guide</button>
  </nav>

  <main id="main"></main>
</div>

<script>
/* ===================== PROGRAMME ===================== */
const DAYS=[["lun","Lundi"],["mar","Mardi"],["mer","Mercredi"],["jeu","Jeudi"],["ven","Vendredi"],["sam","Samedi"],["dim","Dimanche"]];
const TEST_WEEKS=[1,4,8,12];
const BLOCKS=[
 {id:1,name:"Fondations",weeks:[1,2,3,4],color:"var(--b1)",
  goal:"Reconstruire une base de force, relancer le cardio et amorcer la perte de poids. Solidifier épaule, coude, chevilles et lombaires avant d'ajouter de l'intensité.",
  keys:["Technique propre, charges modérées (RPE 7)","Cardio zone 2 + intervalles 30/30","Prévention épaule/coude systématique","Pliométrie basse (corde, pogo, box jump)"]},
 {id:2,name:"Force & puissance",weeks:[5,6,7,8],color:"var(--b2)",
  goal:"Charges plus lourdes et sauts plus intenses pour gagner en explosivité sur les premiers pas, les smashs et les sorties de vitre.",
  keys:["Force lourde 4×5 (RPE 8)","Sauts maximaux et lancers rotatifs","Déplacements spécifiques côté gauche","Intervalles « points de padel » 15/25"]},
 {id:3,name:"Vitesse spécifique",weeks:[9,10,11,12],color:"var(--b3)",
  goal:"Transformer la force en vitesse de jeu : réactivité, répétition d'efforts courts comme en fin de 3e set, puissance au-dessus de la tête.",

/* ===================== STORAGE ===================== */
const COLLS=["logs","weights","tests","tournois","settings","mobilite","weeks"];
const data={logs:{},weights:{},tests:{},tournois:{},settings:{},mobilite:{},weeks:{}};
let db=null, mode="local";
const LSK="padel-plan-v1";
function lsLoad(){try{const r=JSON.parse(localStorage.getItem(LSK)||"null");if(r)COLLS.forEach(c=>data[c]=r[c]||{});}catch(e){}
  if(!data.settings.main){data.settings.main={start:"2026-10-05"};if(!Object.keys(data.weights).length)data.weights.depart={id:"depart",date:"2026-09-28",kg:89};lsSave();}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}}
function exportData(){const blob=new Blob([JSON.stringify({app:"programme-padel",v:1,exported:new Date().toISOString(),data},null,1)],{type:"application/json"});const name=`padel-sauvegarde-${todayIso()}.json`;
  try{const file=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Sauvegarde Programme Padel"}).catch(()=>{});return;}}catch(e){}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
function importData(file){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),d=j.data||j;let n=0;COLLS.forEach(c=>{if(d[c]&&typeof d[c]==="object"){data[c]=d[c];n++;}});if(!n)throw 0;lsSave();render();flash("Sauvegarde restaurée");}catch(e){flash("Ce fichier n'est pas une sauvegarde valide",true);}};r.readAsText(file);}
function lsSave(){try{localStorage.setItem(LSK,JSON.stringify(data));}catch(e){}}
async function save(coll,id,obj){
  data[coll][id]=obj; render();
  if(db){try{await db.collection(coll).doc(id).set(obj);}catch(e){flash("Échec de l'enregistrement : "+(e&&e.code||"erreur"),true);}}
  else lsSave();
}
async function remove(coll,id){
  delete data[coll][id]; render();
  if(db){try{await db.collection(coll).doc(id).delete();}catch(e){}}
  else lsSave();
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ===================== HELPERS ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const todayIso=()=>iso(new Date());
const fr=s=>{if(!s)return"";const d=parse(s);return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"});};
const fmt=(v,dec=1)=>v==null||isNaN(v)?"–":Number(v).toLocaleString("fr-FR",{maximumFractionDigits:dec});
const startDate=()=>data.settings.main?.start||"2026-10-05";
const daysToStart=()=>Math.round((parse(startDate())-parse(todayIso()))/864e5);
function curWeek(){const diff=Math.floor((parse(todayIso())-parse(startDate()))/864e5);return Math.min(12,Math.max(1,Math.floor(diff/7)+1));}
function dateOf(w,di){const d=parse(startDate());d.setDate(d.getDate()+(w-1)*7+di);return iso(d);}
function flash(msg,bad){const t=$("#toast");if(t){t.textContent=msg;t.style.color=bad?"var(--bad)":"var(--ok)";setTimeout(()=>{if(t.textContent===msg)t.textContent="";},2600);}}

let state={tab:"semaine",week:null,day:null,testKey:"saut",open:new Set(),cat:""};
try{const r=JSON.parse(localStorage.getItem("padel-ui")||"{}");if(r.tab)state.tab=r.tab;}catch(e){}
function saveUi(){try{localStorage.setItem("padel-ui",JSON.stringify({tab:state.tab}));}catch(e){}}

/* ===================== CHARTS ===================== */
function niceTicks(min,max,n=4){if(min===max){min-=1;max+=1;}const span=max-min,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),err=step0/mag;const step=(err>=5?10:err>=2?5:err>=1.5?2:1)*mag;const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const t=[];for(let v=lo;v<=hi+1e-9;v+=step)t.push(+v.toFixed(6));return t;}
function lineChart(pts,{unit="",color="var(--court)",target=null}={}){
  if(pts.length===0) return `<div class="empty">Pas encore de mesure. Ajoute la première ci-dessus.</div>`;
  const W=640,H=240,L=46,R=16,T=16,B=30;
  const xs=pts.map(p=>parse(p.x).getTime()),ys=pts.map(p=>p.y);
  let yMin=Math.min(...ys,target??Infinity),yMax=Math.max(...ys,target??-Infinity);
  const ticks=niceTicks(yMin,yMax);yMin=ticks[0];yMax=ticks[ticks.length-1];
  let xMin=Math.min(...xs),xMax=Math.max(...xs);if(xMin===xMax){xMin-=3*864e5;xMax+=3*864e5;}
  const X=v=>L+(v-xMin)/(xMax-xMin)*(W-L-R),Y=v=>T+(1-(v-yMin)/(yMax-yMin))*(H-T-B);
  const path=pts.map((p,i)=>`${i?"L":"M"}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const area=pts.length>1?`${path}L${X(xs[xs.length-1]).toFixed(1)},${H-B}L${X(xs[0]).toFixed(1)},${H-B}Z`:"";
  const xl=[...new Set([0,Math.floor((pts.length-1)/2),pts.length-1])];
  const last=pts[pts.length-1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique">
   ${ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axis" x="${L-8}" y="${Y(t)+4}" text-anchor="end">${fmt(t)}</text>`).join("")}

    o.push(`<g stroke="var(--glass)" stroke-width="5"><line x1="0" y1="${X(10)}" x2="${X(10)}" y2="${X(10)}"/><line x1="0" y1="${X(6)}" x2="0" y2="${X(10)}"/><line x1="${X(10)}" y1="${X(6)}" x2="${X(10)}" y2="${X(10)}"/></g><g stroke="var(--fig-2)" stroke-width="1.5" stroke-dasharray="2 3"><line x1="0" y1="0" x2="0" y2="${X(6)}"/><line x1="${X(10)}" y1="0" x2="${X(10)}" y2="${X(6)}"/></g>`);
    o.push(`<text x="${X(5)}" y="${X(10)+16}" class="ftxt" text-anchor="middle">VITRE DU FOND</text>`);
  } else o.push(`<text x="${X(5)}" y="${X(10)+16}" class="ftxt" text-anchor="middle">${esc(C.lab||"")}</text>`);
  (C.cones||[]).forEach((c,i)=>{const x=c[0]*m,y=c[1]*m;o.push(`<polygon points="${pl([[x,y-7],[x-6,y+5],[x+6,y+5]])}" fill="var(--arrow)"/>`);});
  if(C.spokes)(C.cones||[]).forEach((c,i)=>{const a=[C.player[0]*m,C.player[1]*m],b=[c[0]*m,c[1]*m],d=Math.hypot(b[0]-a[0],b[1]-a[1]),u=[(b[0]-a[0])/d,(b[1]-a[1])/d];o.push(arrowSvg(add(a,u,12),add(b,u,-10)));const mm=add(a,u,d*0.55);o.push(`<circle cx="${f1(mm[0]+u[1]*9)}" cy="${f1(mm[1]-u[0]*9)}" r="7" fill="var(--surface)" stroke="var(--arrow)" stroke-width="1.5"/><text x="${f1(mm[0]+u[1]*9)}" y="${f1(mm[1]-u[0]*9+3.5)}" class="fnum" text-anchor="middle">${i+1}</text>`);});
  (C.segs||[]).forEach(s=>{const a=[s.a[0]*m,s.a[1]*m],b=[s.b[0]*m,s.b[1]*m],d=Math.hypot(b[0]-a[0],b[1]-a[1]),u=[(b[0]-a[0])/d,(b[1]-a[1])/d];o.push(arrowSvg(add(a,u,9),add(b,u,-9)));const mm=add(a,u,d/2);o.push(`<circle cx="${f1(mm[0]-u[1]*10)}" cy="${f1(mm[1]+u[0]*10)}" r="7" fill="var(--surface)" stroke="var(--arrow)" stroke-width="1.5"/><text x="${f1(mm[0]-u[1]*10)}" y="${f1(mm[1]+u[0]*10+3.5)}" class="fnum" text-anchor="middle">${s.n}</text>`);});
  (C.marks||[]).forEach(k=>{o.push(`<circle cx="${X(k.p[0])}" cy="${X(k.p[1])}" r="4" fill="var(--fig)"/><text x="${X(k.p[0])+(k.dx||8)}" y="${X(k.p[1])+(k.dy||4)}" class="ftxt" text-anchor="${k.anc||"start"}">${esc(k.t)}</text>`);});
  if(C.player)o.push(`<circle cx="${X(C.player[0])}" cy="${X(C.player[1])}" r="7" fill="var(--fig)" stroke="var(--surface)" stroke-width="2"/>`);
  return `<svg viewBox="-16 -20 ${10*m+32} ${10*m+42}" role="img" aria-label="${esc(fr.l||"terrain")}">${o.join("")}</svg>`;
}
function drawTl(fr){
  const T=fr.tl,n=Math.min(T.n,8),tot=n*(T.w+T.r),W=300,sc=(W-10)/tot,o=[];let x=0;
  for(let i=0;i<n;i++){const ww=T.w*sc,rw=T.r*sc;o.push(`<rect x="${f1(x)}" y="22" width="${f1(ww-1.5)}" height="46" rx="3" fill="var(--arrow)"/>`);if(i===0)o.push(`<text x="${f1(ww/2)}" y="15" class="ftxt" text-anchor="middle" style="fill:var(--arrow)">${T.w} s</text>`);x+=ww;o.push(`<rect x="${f1(x)}" y="50" width="${f1(rw-1.5)}" height="18" rx="3" fill="var(--rest)"/>`);if(i===0)o.push(`<text x="${f1(x+rw/2)}" y="82" class="ftxt" text-anchor="middle">${T.r} s</text>`);x+=rw;}
  o.push(`<text x="0" y="100" class="ftxt"><tspan style="fill:var(--arrow)">■</tspan> ${esc(T.lab1||"effort intense")}   ■ récupération</text><text x="0" y="116" class="ftxt">× ${T.n} répétitions, puis ${esc(T.sr)} de repos · ${T.sets} séries</text>`);
  return `<svg viewBox="-8 0 ${W+16} 124" role="img" aria-label="${esc(fr.l||"intervalles")}">${o.join("")}</svg>`;
}
function drawFrame(fr){return fr.court?drawCourt(fr):fr.top?drawTop(fr):fr.tl?drawTl(fr):drawPose(fr);}
function figHtml(key){
  const e=EX[key];if(!e||!e.fig)return "";
  const wide=e.fig.some(f=>f.court||f.tl);
  return `<div class="figs ${wide?"wide":""}" style="--n:${e.fig.length}">${e.fig.map(f=>`<figure>${drawFrame(f)}${f.l?`<figcaption>${esc(f.l)}</figcaption>`:""}</figure>`).join("")}</div>`;
}
function exDetail(key,opts={}){

    </div>

  const view={semaine:renderSemaine,mobilite:renderMobilite,exercices:renderExercices,suivi:renderSuivi,tests:renderTests,tournois:renderTournois,programme:renderProgramme,guide:renderGuide}[state.tab]||renderSemaine;
  const ae=document.activeElement;const fid=ae&&ae.id&&$("#main").contains(ae)?ae.id:null;
  if(fid&&state._editing) return;
  // keep unsaved inputs of the session form across re-renders
  const keep={};document.querySelectorAll("#main [data-ex]").forEach(i=>keep[i.id]=i.value);
  const openDetails=[...document.querySelectorAll("#main details[open]")].map(d=>d.dataset.k);
  $("#main").innerHTML=`<div class="panel">${view()}</div>`;
  for(const id in keep){const el=document.getElementById(id);if(el&&!el.value)el.value=keep[id];}
  openDetails.forEach(k=>{const d=document.querySelector(`#main details[data-k="${k}"]`);if(d)d.open=true;});
  $("#sync").textContent="· Données enregistrées sur ce téléphone";
}

/* ===================== EVENTS ===================== */
function toggleMob(dt){if(data.mobilite[dt])remove("mobilite",dt);else save("mobilite",dt,{date:dt,done:true});}
document.addEventListener("click",e=>{
  const wk=e.target.closest("[data-week]");if(wk){state.week=+wk.dataset.week;state.day=null;if(!["semaine","mobilite"].includes(state.tab)){state.tab="semaine";saveUi();}render();return;}
  const tb=e.target.closest("#tabs [data-tab]");if(tb){state.tab=tb.dataset.tab;saveUi();render();window.scrollTo({top:0});return;}
  const gt=e.target.closest("[data-goto]");if(gt){state.tab=gt.dataset.goto;saveUi();render();document.getElementById("tabs").scrollIntoView();return;}
  const hw=e.target.closest("[data-how]");if(hw){const id=hw.dataset.how,box=document.getElementById("d-"+id);const li=hw.closest("li");const k=li?null:null;
    if(state.open.has(id)){state.open.delete(id);box.hidden=true;hw.textContent="Comment faire";hw.setAttribute("aria-expanded","false");}
    else{state.open.add(id);const i=+id.split("-").pop();const p=dayPlan(state.week,state.day);box.innerHTML=exDetail(p.items[i][0]);box.hidden=false;hw.textContent="Masquer";hw.setAttribute("aria-expanded","true");}
    return;}
  const td=e.target.closest("[data-tday]");if(td){save("weeks","w"+state.week,{week:state.week,tournoi:td.dataset.tday});return;}
  const tb2=e.target.closest("[data-timer]");if(tb2){const id=tb2.dataset.timer;if(TM.id===id){tmClose();}else{if(TM.id)tmClose();tmOpen(id);tb2.setAttribute("aria-expanded","true");tmPaint();}return;}
  const tc=e.target.closest("[data-tm]");if(tc){const a=tc.dataset.tm;if(a==="go")tmGo();else if(a==="skip")tmNext();else if(a==="reset")tmReset();else if(a==="close")tmClose();return;}
  const mb=e.target.closest("[data-mob]");if(mb){toggleMob(mb.dataset.mob);return;}
  const ct=e.target.closest("[data-cat]");if(ct){state.cat=ct.dataset.cat;render();return;}
  const dy=e.target.closest("[data-day]");if(dy){state.day=dy.dataset.day;render();return;}
  const dl=e.target.closest("[data-del]");if(dl){const[c,id]=dl.dataset.del.split(":");if(dl.dataset.confirm==="1")remove(c,id);else{dl.dataset.confirm="1";dl.textContent="confirmer ?";setTimeout(()=>{if(dl.isConnected){dl.dataset.confirm="";dl.textContent="supprimer";}},3000);}return;}
  if(e.target.id==="btn-export"){exportData();return;}
  if(e.target.id==="lg-del"){const b=e.target;if(b.dataset.confirm==="1"){remove("logs",`s${state.week}-${state.day}`);}else{b.dataset.confirm="1";b.textContent="Confirmer l'effacement";}}
});
document.addEventListener("focusin",e=>{if(e.target.closest("#main form, #main .inp"))state._editing=true;});
document.addEventListener("focusout",e=>{state._editing=false;});
document.addEventListener("change",e=>{if(e.target.id==="set-start"&&e.target.value){save("settings","main",{start:e.target.value});flash("Date de début enregistrée");return;}if(e.target.id==="file-import"&&e.target.files[0]){importData(e.target.files[0]);e.target.value="";return;}if(e.target.id==="t-sel"){state.testKey=e.target.value;render();}});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;state._editing=false;
  if(f.id==="logForm"){
    const ex={};document.querySelectorAll("[data-ex]").forEach(i=>{if(i.value.trim())ex[i.dataset.ex]=i.value.trim();});
    save("logs",`s${state.week}-${state.day}`,{week:state.week,day:state.day,date:$("#lg-date").value,duree:+$("#lg-duree").value||0,rpe:+$("#lg-rpe").value,done:$("#lg-done").checked,note:$("#lg-note").value.trim(),ex,updated:Date.now()});
    flash("Séance enregistrée");
  }
  if(f.id==="wForm"){const kg=parseFloat($("#w-kg").value);if(!kg){return;}const id=uid();save("weights",id,{id,date:$("#w-date").value,kg});flash("Pesée ajoutée");}
  if(f.id==="tForm"){const id=uid(),r={id,date:$("#t-date").value};let any=false;TESTS.forEach(x=>{const v=$("#t-"+x.k).value;if(v!==""){r[x.k]=+v;any=true;}});if(!any){flash("Remplis au moins un test",true);return;}save("tests",id,r);flash("Tests enregistrés");}
  if(f.id==="trForm"){const id=uid();save("tournois",id,{id,date:$("#tr-date").value,cat:$("#tr-cat").value,lieu:$("#tr-lieu").value.trim(),res:$("#tr-res").value.trim(),matchs:+$("#tr-m").value||0,victoires:+$("#tr-v").value||0,physique:+$("#tr-phy").value,fin:$("#tr-fin").value,note:$("#tr-note").value.trim()});flash("Tournoi enregistré");}
});

/* ===================== BOOT ===================== */
lsLoad();
render();
(async()=>{
  try{
    const c=window.claude;if(!c||!c.use)return;
    const d=await c.use("db");if(!d)return;
    db=d;mode="db";
    COLLS.forEach(coll=>{
      db.collection(coll).onSnapshot(snap=>{
        const o={};snap.docs.forEach(doc=>{const v=doc.data();if(v)o[doc.id]={...v,id:v.id||doc.id};});
        data[coll]=o;render();
      },err=>{});
    });
  }catch(e){}
})();

if("serviceWorker" in navigator&&location.protocol.startsWith("http")){window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{});});}
</script>
